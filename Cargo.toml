[package]
name = "yeetz-bedrock"
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
description = "bedrock — compile an org's situation/ graph into a deterministic TriG register and AGENTS.md projection"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cleverunicornz/bedrock"
readme = "README.md"
keywords = ["yaml-ld", "trig", "rdf", "agents", "knowledge-graph"]
categories = ["command-line-utilities", "development-tools"]
# crates.io name `bedrock` is squatted (2018 Vulkan glue); see spec/donor-ld-research.md.

# Publish whitelist (package hygiene): only these ship on crates.io. Cargo
# always adds Cargo.lock (binary crate) and mandatory Cargo.toml; spec/,
# situation/, tests/, .github are intentionally excluded.
include = ["src/**", "seed/**", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[[bin]]
name = "bedrock"
path = "src/main.rs"

[lib]
name = "bedrock"
path = "src/lib.rs"

[dependencies]
# Exact pins are law (SPINE §5): asseurement boundary — bumps are deliberate acts.
# `serde` itself is intentionally unpinned: it is a shared transitive of the whole
# ecosystem, not a pipeline-stack component; exact-pinning it breaks resolution.
serde_json = "=1.0.151"
serde_norway = "=0.9.42"   # YAML 1.2, serde-norway profile (SPINE §5)
oxjsonld = "=0.2.5"        # JSON-LD 1.1 processor; remote context loading disabled
oxrdf = "=0.3.3"           # quad data model
oxttl = "=0.2.3"           # TriGSerializer
jsonschema = "=0.50.0"     # namespace schemas (SPINE §4 C4)
sha2 = "=0.11.0"           # source digests
include_dir = "=0.7.4"     # embeds the seed/ tree at compile time (SPINE §1 embedded seed; W1 fix for cargo-installed binaries)
# Direct pin of serde_norway's underlying YAML tokenizer (already its dependency):
# C2 forbids anchors/aliases/merge-keys at YAML-syntax level (SPINE §4; W2 floor
# vertices contain markdown emphasis like *can* inside block scalars, so text
# regex scanning is forbidden). serde_norway resolves anchors internally and
# exposes no syntax API, so we scan tokens directly.
unsafe-libyaml-norway = "=0.2.15"
# crates.io lookup for the SPINE §1 version gate (init/adopt only). reqwest is
# ALREADY a transitive dependency of jsonschema (its resolve-http/referencing
# feature), so pinning it directly here adds no new crates to the resolver tree.
# Features mirror exactly what jsonschema 0.50 activates (blocking + rustls via
# aws-lc-rs); the `rustls-no-provider` pairing keeps ONE crypto provider shared.
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "http2", "rustls-no-provider"] }
# rustls crypto-provider install for the gate's reqwest client: the
# `rustls-no-provider` combo (already in the tree via jsonschema) mandates an
# explicit `install_default()` before a Client builds — the same call
# jsonschema's own retriever makes. Draft/aws-lc-rs only; no new crates.
rustls = { version = "=0.23.43", features = ["aws-lc-rs"] }

[profile.release]
lto = true
