version: 1
controls:
  - name: "malformed-identity"
    base: "fixtures/valid/exec_1786800000001_000000000001.yamlld"
    operation: "set-top"
    field: "@id"
    value: "https://yeetz.dev/graph/execution/exec_1786800000009_ffffffffffff"
    expectedCode: "execution_identity_mismatch"
  - name: "unknown-vocabulary"
    base: "fixtures/valid/exec_1786800000001_000000000001.yamlld"
    operation: "set-node"
    node: "https://yeetz.dev/execution/exec_1786800000001_000000000001/transition/0001"
    field: "inventedTerm"
    value: true
    expectedCode: "schema_invalid"
  - name: "class-ownership-violation"
    base: "fixtures/valid/exec_1786800000001_000000000001.yamlld"
    operation: "set-node"
    node: "https://yeetz.dev/execution/exec_1786800000001_000000000001/transition/0002"
    field: "causalClass"
    value: "https://yeetz.dev/definition/validator"
    expectedCode: "class_ownership_invalid"
  - name: "broken-ordering"
    base: "fixtures/valid/exec_1786800000001_000000000001.yamlld"
    operation: "set-node"
    node: "https://yeetz.dev/execution/exec_1786800000001_000000000001/transition/0005"
    field: "previous"
    value: "https://yeetz.dev/execution/exec_1786800000001_000000000001/transition/0003"
    expectedCode: "transition_predecessor_invalid"
  - name: "missing-pointer"
    base: "fixtures/valid/exec_1786800000001_000000000001.yamlld"
    operation: "remove-node"
    node: "https://yeetz.dev/execution/exec_1786800000001_000000000001/artifact/validation-v2"
    expectedCode: "artifact_pointer_missing"
  - name: "unresolved-pointer"
    base: "fixtures/valid/exec_1786800000001_000000000001.yamlld"
    operation: "set-node"
    node: "https://yeetz.dev/execution/exec_1786800000001_000000000001/artifact/evidence"
    field: "path"
    value: "future-epoch-candidate/execution-graph/fixtures/referenced/does-not-exist.md"
    expectedCode: "artifact_pointer_unresolved"
  - name: "candidate-report-mismatch"
    base: "fixtures/valid/exec_1786800000002_000000000002.yamlld"
    operation: "set-node"
    node: "https://yeetz.dev/execution/exec_1786800000002_000000000002/transition/0012"
    field: "candidate"
    value: "https://yeetz.dev/execution/exec_1786800000002_000000000002/artifact/candidate-v1"
    expectedCode: "candidate_identity_mismatch"
  - name: "invalid-disposition"
    base: "fixtures/valid/exec_1786800000002_000000000002.yamlld"
    operation: "set-node"
    node: "https://yeetz.dev/execution/exec_1786800000002_000000000002/transition/0006"
    field: "disposition"
    value: "https://yeetz.dev/disposition/invented"
    expectedCode: "schema_invalid"
  - name: "post-terminal-addition"
    base: "fixtures/valid/exec_1786800000001_000000000001.yamlld"
    operation: "append-after-terminal"
    expectedCode: "post_terminal_transition"
