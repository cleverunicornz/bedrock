# Bedrock CI template — installable by copy into `.github/workflows/`.
#
# The dry run: every PR touching situation/ (or generated AGENTS.md)
# recompiles bedrock from latest open-source main, validates complete source
# plus resident projection (C1–C11, including C1 byte drift), and surfaces
# exact artifact bytes, source/resident counts, Plan lifecycle, record
# residency, and advisory SOFT resident faces over 4096 chars. The agent
# reviews the report and artifact diff in the PR; a human merges; main never
# carries a stale graph. Fork pull requests never run the job.
#
# Always-latest, deliberately unpinned: bedrock is the org's base protocol
# and changes rarely — when it changes, every repo's next situation PR goes
# red together (C10 digest-skew names `bedrock update` as the fix), which is
# exactly the epoch sweep the protocol wants.

name: bedrock

on:
  push:
    paths:
      - 'situation/**'
      - 'AGENTS.md'
  pull_request:
    paths:
      - 'situation/**'
      - 'AGENTS.md'

jobs:
  bedrock:
    runs-on: org-ci-linux-x64

    # Fork-PR guard: run only when the PR head is this repository. A fork's
    # situation/ is untrusted and its diff is meaningless against this repo's
    # committed graph, so skip fork PRs entirely.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install bedrock (latest from source)
        # Always the latest published protocol: compile the binary fresh
        # from the bedrock repository's default branch. No version knob —
        # a protocol change is meant to land everywhere on the next run.
        run: |
          cargo install --locked --force --git https://github.com/cleverunicornz/bedrock yeetz-bedrock

      - name: bedrock check (dry run + size report)
        shell: bash
        run: |
          set -uo pipefail
          status=0
          {
            echo '## bedrock report'
            echo '```'
            bedrock check || status=$?
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: bedrock build
        run: bedrock build

      - name: Verify generated output is committed
        run: |
          if ! git diff --exit-code -- AGENTS.md; then
            echo "error: AGENTS.md (the resident projection) is out of date." >&2
            echo "run 'bedrock build' and commit the regenerated output with your situation/ change." >&2
            exit 1
          fi
