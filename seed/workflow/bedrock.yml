# Bedrock gate — promoted by `bedrock init` into .github/workflows/bedrock.yml.
#
# This is a CALLER STUB, not the gate. The job body lives centrally in
# cleverunicornz/bedrock/.github/workflows/graph.yml and is adopted by tag, so
# no repository ever maintains gate logic and no repository can drift from it.
# Correct the gate once in bedrock; adopt it here by bumping the tag in a
# reviewed PR. `bedrock update` never rewrites a present workflow.
#
# Required status check for branch protection: `bedrock / graph`
#
# No path filter, deliberately. The gate must fire on EVERY pull request — a
# path-filtered trigger would let a code-only PR land in main with no graph
# reference, which is the precise failure this gate exists to prevent.
#
# The tag below is literal because GitHub does not allow expressions in `uses:`.
# The per-repository tool version stays in seed/substrate-lock.json.

name: bedrock

# No `synchronize`: a PR is opened only when the work is already merge-ready,
# so the gate fires once at the boundary — on open, on reopen, and when a
# draft is marked ready. This also means the gate's own commit cannot
# re-trigger it, so there is no push/re-run loop to guard against.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]

concurrency:
  group: bedrock-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  bedrock:
    uses: cleverunicornz/bedrock/.github/workflows/graph.yml@v0.7.0
